website:
  # Paths in this file must include the _extensions folder path
  # favicon: "_extensions/wfrc-brand/assets/logo/abbreviated/WFRC_logo_abbreviated_color_transparent.png"

  twitter-card:
    creator: "@wasatchcouncil"
    site: "@wasatchcouncil"
    card-style: summary_large_image
  open-graph: true
  cookie-consent: false

  # No default announcement is shipped -- add one per-project directly in
  # that project's own _quarto.yml under website:, e.g.:
  #   announcement:
  #     icon: info-circle
  #     dismissable: true
  #     content: "**Your message** — ..."
  #     type: info          # primary | secondary | success | danger | warning | info | light | dark
  #     position: below-navbar

  # repo-url: "https://github.com/WFRCAnalytics/wfrc-brand"
  # repo-actions: [source, issue]

  page-navigation: false
  back-to-top-navigation: false
  # margin-header: subscribe.html

  # Navbar — logo-alt and Follow Us social menu are org-wide.
  # navbar.tools (GitHub) stays per-project — repo URLs differ per site.
  # NOTE: if a project defines its own navbar.right, it replaces this list
  # entirely. Repeat the Follow Us block in that project's _quarto.yml if needed.
  navbar:
    logo-alt: "Wasatch Front Regional Council"
    right:
      - text: Follow Us
        menu:
          - icon: facebook
            text: Facebook
            href: https://www.facebook.com/WasatchFrontRegionalCouncil/
            target: _blank
          - icon: twitter-x
            text: X (Twitter)
            href: https://twitter.com/wasatchcouncil/
            target: _blank
          - icon: instagram
            text: Instagram
            href: https://www.instagram.com/wasatchfrontregionalcouncil/
            target: _blank
          - icon: linkedin
            text: LinkedIn
            href: https://www.linkedin.com/company/wasatch-front-regional-council/
            target: _blank
          - icon: youtube
            text: YouTube
            href: https://www.youtube.com/user/wfrcvideo/
            target: _blank
    tools:
      - icon: github
        text: GitHub
        menu:
          - text: Source Code
            href: https://github.com/WFRCAnalytics/wfrcanalytics.github.io
            target: _blank
          - text: Report a Bug
            href: https://github.com/WFRCAnalytics/wfrcanalytics.github.io/issues/new
            target: _blank
          - text: Ask a Question
            href: https://github.com/WFRCAnalytics/wfrcanalytics.github.io/discussions/new/choose
            target: _blank

  # Footer — all three columns are org-wide defaults.
  # Right column links are site-relative: every site needs contact/index.qmd and
  # terms/index.qmd (templates in _extensions/wfrc-brand/templates/). Local previews
  # then stay local instead of jumping to the live site.
  page-footer:
    left: "© {{< year >}} [Wasatch Front Regional Council](https://wfrc.utah.gov/)"
    center:
      - icon: github
        href: https://github.com/WFRCAnalytics/
        aria-label: GitHub
        target: _blank
      - icon: facebook
        href: https://www.facebook.com/WasatchFrontRegionalCouncil/
        aria-label: Facebook
        target: _blank
      - icon: twitter-x
        href: https://twitter.com/wasatchcouncil/
        aria-label: X (Twitter)
        target: _blank
      - icon: instagram
        href: https://www.instagram.com/wasatchfrontregionalcouncil/
        aria-label: Instagram
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/company/wasatch-front-regional-council/
        aria-label: LinkedIn
        target: _blank
      - icon: youtube
        href: https://www.youtube.com/user/wfrcvideo/
        aria-label: YouTube
        target: _blank
    right:
      - text: Contact
        aria-label: Contact
        href: contact/index.qmd
      - text: Terms of use
        aria-label: Terms of use
        href: terms/index.qmd

# ── HTML format defaults ──────────────────────────────────────────────────────
# These live here (not only in _extension.yml) because Quarto applies
# contributes.formats.html only to the extension's own format (wfrc-brand-html),
# never to plain `format: html`. Paths are relative to the project root.
# Do not add a `dashboard:` key here: in a project-level metadata file it breaks
# the announcement render for every HTML page (Quarto 1.10). Dashboards use
# `format: wfrc-brand-dashboard` instead.
format:
  html:
    theme:
      light:
        - _extensions/wfrc-brand/assets/theme/wfrc.scss
        - _extensions/wfrc-brand/assets/theme/wfrc-light.scss
        - _extensions/wfrc-brand/assets/theme/wfrc-overrides.scss
        - brand
      dark:
        - _extensions/wfrc-brand/assets/theme/wfrc.scss
        - _extensions/wfrc-brand/assets/theme/wfrc-dark.scss
        - _extensions/wfrc-brand/assets/theme/wfrc-overrides.scss
        - brand
    highlight-style:
      light: _extensions/wfrc-brand/assets/theme/wfrc-light.theme
      dark: _extensions/wfrc-brand/assets/theme/wfrc-dark.theme
    respect-user-color-scheme: true
    link-external-newwindow: true
    # Accessibility fixes: decorative listing banners, toggle name, Plot/callout ARIA, scroll regions.
    include-after-body: _extensions/wfrc-brand/assets/js/a11y-fixes.html
    axe: true
    page-layout: full
    toc: true
    toc-expand: 2
    smooth-scroll: true
    grid:
      sidebar-width: 350px

# Freeze — org standard: auto freeze outputs (re-execute only if file updated)
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
execute:
  freeze: auto

engine: knitr
knitr:
  opts_chunk:
    dev: ragg_png
jupyter: python3

citation: false
