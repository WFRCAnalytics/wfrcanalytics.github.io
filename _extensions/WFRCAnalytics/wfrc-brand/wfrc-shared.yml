# Everything below is the same for every WFRC site. A site that needs something different does not edit
# this file or its own _quarto.yml (a value here beats the same key there): it puts only its
# differences in a second file listed AFTER this one, which beats this one:
#   metadata-files:
#     - _extensions/WFRCAnalytics/wfrc-brand/wfrc-shared.yml
#     - _site.yml                 # your differences, e.g. `execute: {freeze: false}`

project:
  # Points the GitHub menu below at the repository the site is built from (see the script's header).
  post-render: _extensions/WFRCAnalytics/wfrc-brand/scripts/github-repo.ts

website:
  # Paths in this file must include the _extensions folder path
  # favicon: "_extensions/WFRCAnalytics/wfrc-brand/assets/logo/abbreviated/WFRC_logo_abbreviated_color_transparent.png"

  # Social cards use one fixed WFRC image. Left to itself, Quarto picks the first figure on the page
  # and, when that figure's alt text contains a "%", warns `Invalid URI '...' in attribute 'alt'`
  # (a Quarto bug). A page can still set its own `image:` in its front matter.
  twitter-card:
    creator: "@wasatchcouncil"
    site: "@wasatchcouncil"
    card-style: summary_large_image
    image: _extensions/WFRCAnalytics/wfrc-brand/assets/social/wfrc-card.png
    image-alt: "Wasatch Front Regional Council"
  open-graph:
    image: _extensions/WFRCAnalytics/wfrc-brand/assets/social/wfrc-card.png
    image-alt: "Wasatch Front Regional Council"
  cookie-consent: false

  # No default announcement is shipped -- add one per-project directly in
  # that project's own _quarto.yml under website:, e.g.:
  #   announcement:
  #     icon: info-circle
  #     dismissable: true
  #     content: "**Your message** — ..."
  #     type: info          # primary | secondary | success | danger | warning | info | light | dark
  #     position: below-navbar

  # repo-url: "https://github.com/WFRCAnalytics/wfrc-brand"
  # repo-actions: [source, issue]

  # "Back to top" link on long pages (a site can turn it off in its _site.yml).
  back-to-top-navigation: true
  # margin-header: subscribe.html

  # Navbar — logo-alt, the Follow Us social menu and the GitHub menu are org-wide. The GitHub links
  # are placeholders that the post-render script above replaces with the site's own repository
  # (and it removes "Ask a Question" when the repository has Discussions off).
  # Lists append, so a project that adds its own `navbar.right` or `navbar.tools` items gets them
  # next to these; do not repeat the Follow Us or GitHub menus.
  navbar:
    logo-alt: "Wasatch Front Regional Council"
    right:
      - text: Follow Us
        menu:
          - icon: facebook
            text: Facebook
            href: https://www.facebook.com/WasatchFrontRegionalCouncil/
            target: _blank
          - icon: twitter-x
            text: X (Twitter)
            href: https://twitter.com/wasatchcouncil/
            target: _blank
          - icon: instagram
            text: Instagram
            href: https://www.instagram.com/wasatchfrontregionalcouncil/
            target: _blank
          - icon: linkedin
            text: LinkedIn
            href: https://www.linkedin.com/company/wasatch-front-regional-council/
            target: _blank
          - icon: youtube
            text: YouTube
            href: https://www.youtube.com/user/wfrcvideo/
            target: _blank

    tools:
      - icon: github
        text: GitHub
        menu:
          - text: Source Code
            href: https://github.com/WFRCAnalytics#wfrc-repo
            target: _blank
          - text: Report a Bug
            href: https://github.com/WFRCAnalytics#wfrc-repo-issues
            target: _blank
          - text: Ask a Question
            href: https://github.com/WFRCAnalytics#wfrc-repo-discussions
            target: _blank

  # Footer — all three columns are org-wide defaults. Contact and Terms of use are single pages
  # maintained on wfrcanalytics.github.io, so no site has to carry (or keep in step) its own copy.
  page-footer:
    left: "© {{< year >}} [Wasatch Front Regional Council](https://wfrc.utah.gov/)"
    center:
      - icon: github
        href: https://github.com/WFRCAnalytics/
        aria-label: GitHub
        target: _blank
      - icon: facebook
        href: https://www.facebook.com/WasatchFrontRegionalCouncil/
        aria-label: Facebook
        target: _blank
      - icon: twitter-x
        href: https://twitter.com/wasatchcouncil/
        aria-label: X (Twitter)
        target: _blank
      - icon: instagram
        href: https://www.instagram.com/wasatchfrontregionalcouncil/
        aria-label: Instagram
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/company/wasatch-front-regional-council/
        aria-label: LinkedIn
        target: _blank
      - icon: youtube
        href: https://www.youtube.com/user/wfrcvideo/
        aria-label: YouTube
        target: _blank
    right:
      - text: Contact
        aria-label: Contact
        href: https://wfrcanalytics.github.io/contact/
      - text: Terms of use
        aria-label: Terms of use
        href: https://wfrcanalytics.github.io/terms/

# ── HTML format defaults ──────────────────────────────────────────────────────
# These live here (not only in _extension.yml) because Quarto applies
# contributes.formats.html only to the extension's own format (wfrc-brand-html),
# never to plain `format: html`. Paths are relative to the project root.
# Do not add a `dashboard:` key here: in a project-level metadata file it breaks
# the announcement render for every HTML page (Quarto 1.10). Dashboards use
# `format: wfrc-brand-dashboard` instead.
format:
  html:
    theme:
      light:
        - _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc.scss
        - _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc-light.scss
        - _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc-overrides.scss
        - brand
      dark:
        - _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc.scss
        - _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc-dark.scss
        - _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc-overrides.scss
        - brand
    highlight-style:
      light: _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc-light.theme
      dark: _extensions/WFRCAnalytics/wfrc-brand/assets/theme/wfrc-dark.theme
    respect-user-color-scheme: true
    link-external-newwindow: true
    # Accessibility fixes: decorative listing banners, toggle name, Plot/callout ARIA, scroll regions.
    include-after-body: _extensions/WFRCAnalytics/wfrc-brand/assets/js/a11y-fixes.html
    axe: true
    page-layout: full
    toc: true
    toc-expand: 2
    # smooth-scroll is not set: Quarto's option loads zenscroll, which throws "Mismatched anonymous
    # define() module" on pages where RequireJS is present (Plotly, notebook widgets). The theme
    # smooth-scrolls with CSS instead (wfrc-overrides.scss).
    grid:
      sidebar-width: 350px

# Freeze — org standard: auto freeze outputs (re-execute only if file updated)
# (see https://quarto.org/docs/projects/code-execution.html#freeze). Not set here on purpose: `engine`
# and `jupyter`, which Quarto picks from your code cells.
execute:
  freeze: auto


citation: false
