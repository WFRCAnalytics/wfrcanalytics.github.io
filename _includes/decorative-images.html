<script>
// Listing card banners are decorative. Quarto drops an empty alt, so set it after the cards render.
(function () {
  function mark(root) {
    root.querySelectorAll('img.thumbnail-image:not([alt])').forEach(function (img) {
      img.setAttribute('alt', '');
    });
  }
  mark(document);
  new MutationObserver(function () { mark(document); })
    .observe(document.body, { childList: true, subtree: true });
})();
</script>
