project:
  type: website
  output-dir: docs
  pre-render: scripts/build_lists.py
  resources:
    - _extensions/wfrc-brand/assets/cards/*.svg
    - assets/data/site-index.json
    - assets/js/lost-map.js
    - assets/js/quick-jump.js
    - assets/shots/*.jpg
  brand: _extensions/wfrc-brand/brand.yml

metadata-files:
  - _extensions/wfrc-brand/wfrc-shared.yml

website:
  title: "Analytics"
  description: The Wasatch Front Regional Council builds consensus and enhances quality of life by developing and implementing visions and plans for a well-functioning multi-modal transportation system, livable communities, a strong economy, and a healthy environment.
  favicon: 'assets/logo/abbreviated/WFRC_logo_abbreviated_color_transparent.png'
  site-url: 'https://wfrcanalytics.github.io'

  # repo-url: 'https://https://github.com/WFRCAnalytics/wfrcanalytics.github.io'
  # repo-actions: [source, issue]

  # page-navigation: false
  # back-to-top-navigation: false
  # margin-header: subscribe.html

  twitter-card:
    creator: "@wasatchcouncil"
    site: "@wasatchcouncil"
    card-style: summary_large_image

  open-graph: true
  cookie-consent: false

  # Quarto's built-in search only covers page text and cannot hold external links; the quick-jump
  # palette (assets/js/quick-jump.js) replaces it. Its shortcuts are turned off to avoid a clash.
  search:
    keyboard-shortcut: []

  navbar:
    tools:
      - icon: search
        text: Search
        href: "#quick-jump"
    # logo: 'assets/logo/horizontal/WFRC_logo_horizontal_color_transparent.png'
    # logo-alt: 'WFRC site theme-based logo'

    right:
      - href: explore/index.qmd
        text: Explore
      - text: Models
        menu:
          - text: Overview
            href: models/index.qmd
          - text: "---"
          - text: Travel Demand Model
            href: models/tdm.qmd
          - text: Real-Estate Market Model
            href: models/remm.qmd
          - text: Bike Demand Model
            href: models/bdm.qmd
          - text: "---"
          - text: Get the model
            href: models/get-the-model.qmd
          - text: TDM documentation
            href: https://wfrc.utah.gov/wftdm-docs/
            target: _blank
      - href: reports/index.qmd
        text: Reports
      - href: data/index.qmd
        text: Data
      - href: code/index.qmd
        text: Code
      - href: updates/index.qmd
        text: Updates
      - href: about.qmd
        text: About

format:
  html:
    css: assets/css/site.css
    include-in-header:
      - assets/js/listing-chips.html
      - assets/js/quick-jump.html

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: auto
