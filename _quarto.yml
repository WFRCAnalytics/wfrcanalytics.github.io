project:
  type: website
  output-dir: docs
  pre-render: scripts/build_lists.py
  brand: _extensions/wfrc-brand/brand.yml

metadata-files:
  - _extensions/wfrc-brand/wfrc-shared.yml

website:
  title: "Analytics"
  description: The Wasatch Front Regional Council builds consensus and enhances quality of life by developing and implementing visions and plans for a well-functioning multi-modal transportation system, livable communities, a strong economy, and a healthy environment.
  favicon: 'assets/logo/abbreviated/WFRC_logo_abbreviated_color_tranparent.png'
  site-url: 'https://wfrcanalytics.github.io'

  # repo-url: 'https://https://github.com/WFRCAnalytics/wfrcanalytics.github.io'
  # repo-actions: [source, issue]

  # page-navigation: false
  # back-to-top-navigation: false
  # margin-header: subscribe.html

  announcement:
    icon: info-circle
    dismissable: true
    content: "**Alert** - This website currently contains mostly placeholder items and is currently under development."
    type: primary
    position: below-navbar

  twitter-card:
    creator: "@wasatchcouncil"
    site: "@wasatchcouncil"
    card-style: summary_large_image

  open-graph: true
  cookie-consent: false

  navbar:
    # logo: 'assets/logo/horizontal/WFRC_logo_horizontal_color_transparent.png'
    # logo-alt: 'WFRC site theme-based logo'

    right:
      - href: explore/index.qmd
        text: Explore
      - text: Models
        menu:
          - text: Travel Demand Model
            href: 1-tdm/index.qmd
          - text: Real-Estate Market Model
            href: 2-remm/index.qmd
          - text: Bike Demand Model
            href: 3-bdm/index.qmd
          - text: "---"
          - text: TDM documentation
            href: https://wfrc.utah.gov/wftdm-docs/
            target: _blank
      - href: reports/index.qmd
        text: Reports
      - href: data/index.qmd
        text: Data
      - href: code/index.qmd
        text: Code
      - href: about.qmd
        text: About

  sidebar:
    - id: tdm-current
      title: "TDM 9.2.0"
      style: "docked"
      search: true
      collapse-level: 2
      contents:
        - 1-tdm/current/index.qmd
        - section: "What's New"
          contents:
            - 1-tdm/current/whats-new/overview.qmd
            - 1-tdm/current/whats-new/highway-network.qmd
            - 1-tdm/current/whats-new/access-to-opportunity.qmd
            - 1-tdm/current/whats-new/socioeconomic-data.qmd
        - section: "Model Validation"
          contents:
            - 1-tdm/current/validation/index.qmd
            - text: "---"
            - section: "Trip Distribution"
              contents:
                - 1-tdm/current/validation/trip-distribution/average-trip-length.qmd
                - 1-tdm/current/validation/trip-distribution/trip-length-frequency.qmd
            - section: "Mode Choice"
              contents:
                - 1-tdm/current/validation/mode-choice/mode-share.qmd
                - 1-tdm/current/validation/mode-choice/transit-trips-boardings.qmd
            - section: "Highway Assignment"
              contents:
                - 1-tdm/current/validation/highway-assignment/volumes.qmd
                - 1-tdm/current/validation/highway-assignment/travel-times.qmd
        - section: "Model Process Report"
          contents:
            - 1-tdm/current/process-report/index.qmd
        - section: "Model Development"
          contents:
            - 1-tdm/current/development/index.qmd
            - text: "---"
            - section: "Inputs Processing"
              contents:
                - text: "TDM-INP-External-Forecasts"
                  href: https://wfrcanalytics.github.io/TDM-INP-External-Forecasts/
                  target: _blank
                - text: "TDM-INP-College-Enrollment"
                  href: https://wfrcanalytics.github.io/TDM-INP-College-Enrollment/
                  target: _blank
            - section: "Estimate Parameters"
              contents:
                - text: "TDM-EST-Auto-Operating-Costs"
                  href: https://wfrcanalytics.github.io/TDM-EST-Auto-Operating-Costs/
                  target: _blank
                - text: "TDM-EST-TAZ-Median-Income"
                  href: https://wfrcanalytics.github.io/TDM-EST-TAZ-Median-Income/
                  target: _blank
                - text: "TDM-EST-Value-Of-Time"
                  href: https://wfrcanalytics.github.io/TDM-EST-Value-Of-Time/
                  target: _blank
            - section: "Model Calibration"
              contents:
                - text: "Calibration reports"
                  href: https://wfrcanalytics.github.io/WF-TDM-Calibration/
                  target: _blank
                - text: "All components (Code catalog)"
                  href: code/index.qmd

